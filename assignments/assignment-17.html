<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Assignment 17 - Form Validation</title></head>
<body><h1>Validated Registration Form</h1><form action="../submit.php" method="post">
<label for="fullname">Name:</label><input id="fullname" name="fullname" type="text" required minlength="3"><br><br>
<label for="email">Email:</label><input id="email" name="email" type="email" required><br><br>
<label for="mobile">Mobile (10 digits):</label><input id="mobile" name="mobile" type="tel" pattern="[0-9]{10}" title="Enter exactly 10 digits" required><br><br>
<label for="password">Password:</label><input id="password" name="password" type="password" minlength="8" required><br><br>
<label for="age">Age (18-30):</label><input id="age" name="age" type="number" min="18" max="30" required><br><br>
<button type="submit">Submit</button><button type="reset">Reset</button></form></body></html>
