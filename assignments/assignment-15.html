<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Assignment 15 - Form Inputs</title></head>
<body><h1>Student Information Form</h1><form><fieldset><legend>Personal Details</legend>
<label for="name">Full name:</label><input id="name" name="name" type="text" required><br><br>
<label for="email">Email:</label><input id="email" name="email" type="email" required><br><br>
<label for="phone">Mobile:</label><input id="phone" name="phone" type="tel"><br><br>
<label for="dob">Date of birth:</label><input id="dob" name="dob" type="date"><br><br>
<span>Gender:</span> <label><input type="radio" name="gender" value="female"> Female</label> <label><input type="radio" name="gender" value="male"> Male</label><br><br>
<label><input type="checkbox" name="agree" required> I confirm the details are correct.</label></fieldset><br><button type="submit">Submit</button></form></body></html>
