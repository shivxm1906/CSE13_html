<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Assignment 10 - Multimedia</title></head>
<body><h1>Multimedia in HTML</h1><h2>Image</h2><img src="https://placehold.co/500x250?text=Multimedia" alt="Sample multimedia banner" width="500">
<h2>Video</h2><video controls width="480" poster="https://placehold.co/480x270?text=Video"><source src="media/sample-video.mp4" type="video/mp4">Your browser does not support video.</video>
<h2>Audio</h2><audio controls><source src="media/sample-audio.mp3" type="audio/mpeg">Your browser does not support audio.</audio>
<h2>YouTube video</h2><iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/ysz5S6PUM-U" title="Sample YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
<p>Place your own media files in the media folder to use the video and audio players.</p></body></html>
